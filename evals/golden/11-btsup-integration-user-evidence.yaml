  asks_for: [data_change]
  app: zoominfo
  owning_team: bt
  integration_user: true
  evidence: last_login
  environment: production
  requires_recipe_change: false
  requires_deployment: false
  reproducible: true
action:
  kind: deactivate_integration_user
  system: zoominfo
  environment: production
