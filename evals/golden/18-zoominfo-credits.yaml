# BTSUP-77631 corrected twice. The routing turns on one distinction: a request
# for more credits is a budget decision, a credit behaving oddly is an admin
# console investigation.
domain: btsup
ticket:
  mark_involved: assigned
  asks_for: [credits]
  app: zoominfo
  owning_team: bt
  credit_request_type: investigation
  requires_recipe_change: false
action: {kind: investigate_credits, system: zoominfo, environment: production, audience: internal, reversible: true, records_affected: 0}
expect:
  disposition: ROUTE
  owner: bt_support_zoominfo_admin
  must_fire: [BTS-033]
  must_not_fire: [BTS-030, BTS-034, BTS-035]
# Why golden: "are the Nooks credits a different pool from the usual ones" is a
# question only someone inside the ZoomInfo console can answer. Routing it to
# Marketing Ops sends an investigation to people who cannot run it.
