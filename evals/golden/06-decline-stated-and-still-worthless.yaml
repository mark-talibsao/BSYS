  blocked_by: none
  states_problem: true
  states_solution: false
  has_written_requirements: true
  consequence_of_inaction: none
  deadline_days: 60
  users_affected: 30
  revenue_linked: false
  recurring: true
  similar_prior_requests: 0
  production_impact: false
  encodes_policy: false
  declarative_option_exists: false
  effort_band: M
impact:
  blast_radius: { looked_up: true, recipes: 0, objects: [Opportunity] }
  records_affected: 0
  reversible: true
action:
  kind: scheduled_export
  system: salesforce
  environment: production
  audience: internal
  reversible: true
  records_affected: 0
expect:
