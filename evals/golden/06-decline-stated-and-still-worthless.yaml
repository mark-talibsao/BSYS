    Could we get the pipeline board auto-exported to PDF and emailed out every
    Monday? People open the dashboard anyway, but a PDF would be nice to have
    in the deck.
  requester: { name: "redacted", team: sales_ops, seniority: manager }
  asks_for: [new_report]
